# These limits are used by MoveIt and augment/override the definitions in ur_description.
#
# While the robot does not inherently have any limits on joint accelerations (only on torques),
# MoveIt needs them for time parametrization. They were chosen conservatively to work in most use
# cases. For specific applications, higher values might lead to better execution performance.

joint_limits:
  left_lift_joint:
    has_acceleration_limits: true
    max_acceleration: 0.3
    has_effort_limits: true
    has_position_limits: true
    has_velocity_limits: true
    max_effort: 100.0
    max_position: 0.5
    max_velocity: 0.12
    # Gazebo/ros2_control can report tiny negative values around zero
    # (e.g. -1e-14). Keep a small numerical tolerance while preserving the
    # physical lower stop at 0 m for planning-scale motions.
    min_position: -0.001

  right_lift_joint:
    has_acceleration_limits: true
    max_acceleration: 0.3
    has_effort_limits: true
    has_position_limits: true
    has_velocity_limits: true
    max_effort: 100.0
    max_position: 0.5
    max_velocity: 0.12
    # Gazebo/ros2_control can report tiny negative values around zero
    # (e.g. -1e-14). Keep a small numerical tolerance while preserving the
    # physical lower stop at 0 m for planning-scale motions.
    min_position: -0.001

  shoulder_pan_joint:
